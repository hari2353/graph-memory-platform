[project]
name = "graph-memory-platform"
version = "0.1.0"
description = "Generic, enterprise-grade memory platform for AI agents: signals -> ClickHouse ledger -> deterministic graph projection (ClickGraph) -> hyperpersonalized context via MCP/REST/webhooks/SDKs."
readme = "README.md"
authors = [{ name = "hari2353" }]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "clickhouse-connect>=0.8",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
embedded = ["chdb>=1.3; sys_platform != 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "live: requires a real ClickHouse + ClickGraph server (skipped by default)",
]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.13,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "graph_memory"

[project.scripts]
platform = "graph_memory.ops.cli:main"
